services:
  inferno:
    build:
      context: ./
    volumes:
      - ./data:/opt/inferno/data
      - ./lib/:/opt/inferno/lib
      - ./:/opt/inferno/
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      resource-keeper:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inferno
      POSTGRES_USER: postgres
      TX_SERVER_URL: https://tx.dev.hl7.org.au/fhir
      RESOURCE_KEEPER_URL: http://resource-keeper:4567
  inferno-worker:
    build:
      context: ./
    volumes:
      - ./data:/opt/inferno/data
    command: bundle exec sidekiq -r ./worker.rb
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      resource-keeper:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inferno
      POSTGRES_USER: postgres
      RESOURCE_KEEPER_URL: http://resource-keeper:4567
  validator-api:
    image: markiantorno/validator-wrapper:1.0.70
    environment:
      SESSION_CACHE_DURATION: -1
    volumes:
      - ./lib/au_core_test_kit/igs:/home/igs
  nginx:
    image: nginx
    ports:
      - "80:80"
    command: [nginx, '-g', 'daemon off;']
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      validator-api:
        condition: service_started
      inferno:
        condition: service_started
  redis:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
  postgres:
    image: postgres:16.2-alpine3.19
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inferno
    volumes:
      - ./config/postgres_init:/docker-entrypoint-initdb.d:ro
  resource-keeper:
    image: ghcr.io/projkov/inferno_resources_keeper:3fb87ff
    platform: linux/amd64
    restart: always
    environment:
      DATABASE_URL: postgres://resource_api:resource_api@postgres:5432/resource_api_dev
    depends_on:
      postgres:
        condition: service_healthy
  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
volumes:
  redis-data:
