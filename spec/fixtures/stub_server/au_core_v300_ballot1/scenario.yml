        response: { select: "Bundle.entry.resource.ofType(Observation).where(category.coding.where((system = 'http://terminology.hl7.org/CodeSystem/observation-category' and code = 'vital-signs')).exists() and subject.reference = 'Patient/wang-li' and (status = 'final'))" }
