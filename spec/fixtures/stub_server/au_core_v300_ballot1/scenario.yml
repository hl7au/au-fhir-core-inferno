server:
  fhir:
    sources:
      - package: ../../../../lib/au_core_test_kit/igs/3.0.0-ballot1.tgz
    # Each search is answered with its own criterion over every IG Patient, not a fixed id.
    # Birthdate searches drop ronny-irvine first: its birthDate is only a data-absent-reason
    # extension, which fhirpath-rb 0.1.7 can't compare with a date.
    pairs:
      # _id: the first search, by GET for each patient and by POST for the first.
      - request: { path: /Patient, query: { _id: wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(id = 'wang-li')" }
      - request: { method: POST, path: /Patient/_search, body: { _id: wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(id = 'wang-li')" }
      - request: { path: /Patient, query: { _id: howe-deangelo } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(id = 'howe-deangelo')" }
      # Single parameters, with values taken from wang-li.
      - request: { path: /Patient, query: { family: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(name.where(family.lower().startsWith('wang')).exists())" }
      - request: { path: /Patient, query: { gender: male } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(gender = 'male')" }
      - request: { path: /Patient, query: { indigenous-status: '4' } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(extension.where(url = 'http://hl7.org.au/fhir/StructureDefinition/indigenous-status').valueCoding.code = '4')" }
      - request: { path: /Patient, query: { name: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(name.where(family.lower().startsWith('wang') or given.where(lower().startsWith('wang')).exists()).exists())" }
      # Birthdate with each comparator.
      - request: { path: /Patient, query: { birthdate: gt1975-05-02 } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate > @1975-05-02)" }
      - request: { path: /Patient, query: { birthdate: ge1975-05-02 } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate >= @1975-05-02)" }
      - request: { path: /Patient, query: { birthdate: lt1975-05-04 } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate < @1975-05-04)" }
      - request: { path: /Patient, query: { birthdate: le1975-05-04 } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate <= @1975-05-04)" }
      # Parameter combinations.
      - request: { path: /Patient, query: { birthdate: gt1975-05-02, family: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate > @1975-05-02 and name.where(family.lower().startsWith('wang')).exists())" }
      - request: { path: /Patient, query: { birthdate: gt1975-05-02, name: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate > @1975-05-02 and name.where(family.lower().startsWith('wang') or given.where(lower().startsWith('wang')).exists()).exists())" }
      - request: { path: /Patient, query: { family: Wang, gender: male } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(gender = 'male' and name.where(family.lower().startsWith('wang')).exists())" }
      - request: { path: /Patient, query: { gender: male, name: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(gender = 'male' and name.where(family.lower().startsWith('wang') or given.where(lower().startsWith('wang')).exists()).exists())" }
      - request: { path: /Patient, query: { birthdate: ge1975-05-02, family: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate >= @1975-05-02 and name.where(family.lower().startsWith('wang')).exists())" }
      - request: { path: /Patient, query: { birthdate: ge1975-05-02, name: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate >= @1975-05-02 and name.where(family.lower().startsWith('wang') or given.where(lower().startsWith('wang')).exists()).exists())" }
      - request: { path: /Patient, query: { birthdate: lt1975-05-04, family: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate < @1975-05-04 and name.where(family.lower().startsWith('wang')).exists())" }
      - request: { path: /Patient, query: { birthdate: lt1975-05-04, name: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate < @1975-05-04 and name.where(family.lower().startsWith('wang') or given.where(lower().startsWith('wang')).exists()).exists())" }
      - request: { path: /Patient, query: { birthdate: le1975-05-04, family: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate <= @1975-05-04 and name.where(family.lower().startsWith('wang')).exists())" }
      - request: { path: /Patient, query: { birthdate: le1975-05-04, name: Wang } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate <= @1975-05-04 and name.where(family.lower().startsWith('wang') or given.where(lower().startsWith('wang')).exists()).exists())" }
      # Birthdate twice (multiple AND).
      - request: { path: /Patient, query: { birthdate: [ge1950-01-01, le2050-01-01] } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate >= @1950-01-01 and birthDate <= @2050-01-01)" }
      - request: { path: /Patient, query: { birthdate: [gt1950-01-01, lt2050-01-01] } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate > @1950-01-01 and birthDate < @2050-01-01)" }
      # Identifier as a value and as system|value.
      - request: { path: /Patient, query: { identifier: '22421441' } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(identifier.value = '22421441')" }
      - request: { path: /Patient, query: { identifier: 'http://ns.electronichealth.net.au/id/hi/ihi/1.0|8003608000311621' } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(identifier.where(system = 'http://ns.electronichealth.net.au/id/hi/ihi/1.0' and value = '8003608000311621').exists())" }
      - request: { path: /Patient, query: { identifier: 'http://ns.electronichealth.net.au/id/hpio-scoped/medicalrecord/1.0/8003626566699734|22421441' } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(identifier.where(system = 'http://ns.electronichealth.net.au/id/hpio-scoped/medicalrecord/1.0/8003626566699734' and value = '22421441').exists())" }
      # Bodyheight (Observation), for wang-li's bodyheight-1. Dates are matched on effectiveDateTime,
      # which every IG vital sign uses.
      - request: { path: /Observation, query: { patient: wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(subject.reference = 'Patient/wang-li')" }
      - request: { path: /Observation, query: { patient: howe-deangelo } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(subject.reference = 'Patient/howe-deangelo')" }
      - request: { method: POST, path: /Observation/_search, body: { code: "8302-2", patient: wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '8302-2').exists() and subject.reference = 'Patient/wang-li')" }
      - request: { method: POST, path: /Observation/_search, body: { code: "50373000", patient: wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '50373000').exists() and subject.reference = 'Patient/wang-li')" }
      - request: { path: /Observation, query: { code: "8302-2" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '8302-2').exists())" }
      - request: { path: /Observation, query: { code: "50373000" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '50373000').exists())" }
      - request: { path: /Observation, query: { code: "50373000", patient: wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '50373000').exists() and subject.reference = 'Patient/wang-li')" }
      - request: { path: /Observation, query: { code: "8302-2,50373000" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '8302-2' or code = '50373000').exists())" }
      - request: { path: /Observation, query: { category: vital-signs } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(category.coding.where(code = 'vital-signs').exists())" }
      - request: { path: /Observation, query: { category: "http://terminology.hl7.org/CodeSystem/observation-category|vital-signs" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(category.coding.where((system = 'http://terminology.hl7.org/CodeSystem/observation-category' and code = 'vital-signs')).exists())" }
      - request: { path: /Observation, query: { status: final } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where((status = 'final'))" }
      - request: { path: /Observation, query: { status: "final,amended" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where((status = 'final' or status = 'amended'))" }
      - request: { path: /Observation, query: { status: "registered,preliminary" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where((status = 'registered' or status = 'preliminary'))" }
      - request: { path: /Observation, query: { status: "corrected,cancelled" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where((status = 'corrected' or status = 'cancelled'))" }
      - request: { path: /Observation, query: { status: "entered-in-error,unknown" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where((status = 'entered-in-error' or status = 'unknown'))" }
      - request: { path: /Observation, query: { date: "gt2016-07-01T00:00:00+00:00" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(effectiveDateTime > @2016-07-01T00:00:00+00:00)" }
      - request: { path: /Observation, query: { date: "ge2016-07-01T00:00:00+00:00" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(effectiveDateTime >= @2016-07-01T00:00:00+00:00)" }
      - request: { path: /Observation, query: { date: "lt2016-07-03T00:00:00+00:00" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(effectiveDateTime < @2016-07-03T00:00:00+00:00)" }
      - request: { path: /Observation, query: { date: "le2016-07-03T00:00:00+00:00" } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(effectiveDateTime <= @2016-07-03T00:00:00+00:00)" }
      - request: { path: /Observation, query: { date: ["ge1950-01-01T00:00:00.000Z", "le2050-01-01T23:59:59.999Z"] } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(effectiveDateTime >= @1950-01-01T00:00:00.000Z and effectiveDateTime <= @2050-01-01T23:59:59.999Z)" }
      - request: { path: /Observation, query: { date: ["gt1950-01-01T00:00:00.000Z", "lt2050-01-01T23:59:59.999Z"] } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(effectiveDateTime > @1950-01-01T00:00:00.000Z and effectiveDateTime < @2050-01-01T23:59:59.999Z)" }
      - request: { path: /Observation, query: { code: "8302-2", patient: wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '8302-2').exists() and subject.reference = 'Patient/wang-li')" }
      - request: { path: /Observation, query: { code: "8302-2", patient: Patient/wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '8302-2').exists() and subject.reference = 'Patient/wang-li')" }
      - request: { path: /Observation, query: { code: "8302-2", patient: howe-deangelo } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '8302-2').exists() and subject.reference = 'Patient/howe-deangelo')" }
      - request: { path: /Observation, query: { code: "8302-2", date: "ge1950-01-01T00:00:00.000Z", patient: howe-deangelo } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '8302-2').exists() and effectiveDateTime >= @1950-01-01T00:00:00.000Z and subject.reference = 'Patient/howe-deangelo')" }
      - request: { path: /Observation, query: { code: "50373000", patient: howe-deangelo } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '50373000').exists() and subject.reference = 'Patient/howe-deangelo')" }
      - request: { path: /Observation, query: { code: "50373000", date: "ge1950-01-01T00:00:00.000Z", patient: howe-deangelo } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(code.coding.where(code = '50373000').exists() and effectiveDateTime >= @1950-01-01T00:00:00.000Z and subject.reference = 'Patient/howe-deangelo')" }
      - request: { path: /Observation, query: { category: vital-signs, patient: wang-li } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(category.coding.where(code = 'vital-signs').exists() and subject.reference = 'Patient/wang-li')" }
