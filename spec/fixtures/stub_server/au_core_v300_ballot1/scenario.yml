      - request: { path: /Observation, query: { category: vital-signs, patient: wang-li, status: final } }
        response: { select: "Bundle.entry.resource.ofType(Observation).where(category.coding.where(code = 'vital-signs').exists() and subject.reference = 'Patient/wang-li' and (status = 'final'))" }
