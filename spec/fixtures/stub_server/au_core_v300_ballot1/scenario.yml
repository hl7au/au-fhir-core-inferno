# Paths are relative to this file. The `server:` block is fhir_stub_server's config: see
# "Working with LLM agents" in its README before changing it.
suite_id: au_core_v300_ballot1
groups:
  - au_core_v300_ballot1_patient
inputs:
  patient_ids: wang-li, howe-deangelo
expected:
  au_core_v300_ballot1_patient__id_search_test: pass
  au_core_v300_ballot1_patient_birthdate_search_test: pass
  au_core_v300_ballot1_patient_family_search_test: pass
  au_core_v300_ballot1_patient_gender_search_test: pass
  au_core_v300_ballot1_patient_indigenous_status_search_test: pass
  au_core_v300_ballot1_patient_identifier_search_test: pass
  au_core_v300_ballot1_patient_name_search_test: pass
  au_core_v300_ballot1_patient_gender_identity_search_test: skip # neither patient has a gender identity
  au_core_v300_ballot1_patient_birthdate_family_search_test: pass
  au_core_v300_ballot1_patient_birthdate_name_search_test: pass
  au_core_v300_ballot1_patient_family_gender_search_test: pass
  au_core_v300_ballot1_patient_gender_name_search_test: pass
  au_core_v300_ballot1_patient_indigenous_status_multiple_or_search_test: skip
  au_core_v300_ballot1_patient_gender_identity_multiple_or_search_test: skip
  au_core_v300_ballot1_patient_birthdate_multiple_and_search_test: pass
  au_core_v300_ballot1_patient_indigenous_status_multiple_and_search_test: skip
  au_core_v300_ballot1_patient_gender_identity_multiple_and_search_test: skip
  au_core_v300_ballot1_patient_identifier_ihi_search_test: pass
  au_core_v300_ballot1_patient_identifier_medicare_search_test: skip
  au_core_v300_ballot1_patient_identifier_dva_search_test: skip
  au_core_v300_ballot1_patient_read_test: pass
  au_core_v300_ballot1_patient_validation_test: fail # the canned error for howe-deangelo
  au_core_v300_ballot1_patient_must_support_test: skip # the two patients lack some Must Support elements; the test skips, never fails
server:
  dictionary: dictionary.yml
  fhir:
    sources:
      - package: ../../../../lib/au_core_test_kit/igs/3.0.0-ballot1.tgz
    # Each search is answered with its own criterion over every IG Patient, not a fixed id.
    # Birthdate searches drop ronny-irvine first: its birthDate is only a data-absent-reason
    # extension, which fhirpath-rb 0.1.7 can't compare with a date.
    pairs:
      # _id: the first search, by GET for each patient and by POST for the first.
      - request: { path: /Patient, query: { _id: "${patient_id}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(id = '${patient_id}')" }
      - request: { method: POST, path: /Patient/_search, body: { _id: "${patient_id}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(id = '${patient_id}')" }
      - request: { path: /Patient, query: { _id: "${second_patient_id}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(id = '${second_patient_id}')" }
      # Single parameters, with values taken from the first patient.
      - request: { path: /Patient, query: { family: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(name.where(family.lower().startsWith('${family}'.lower())).exists())" }
      - request: { path: /Patient, query: { gender: "${gender}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(gender = '${gender}')" }
      - request: { path: /Patient, query: { indigenous-status: "${indigenous_status}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(extension.where(url = 'http://hl7.org.au/fhir/StructureDefinition/indigenous-status').valueCoding.where(code = '${indigenous_status}').exists())" }
      - request: { path: /Patient, query: { name: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(name.where(family.lower().startsWith('${family}'.lower()) or given.where(lower().startsWith('${family}'.lower())).exists()).exists())" }
      # Birthdate with each comparator.
      - request: { path: /Patient, query: { birthdate: "gt${day_before_birthdate}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate > @${day_before_birthdate})" }
      - request: { path: /Patient, query: { birthdate: "ge${day_before_birthdate}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate >= @${day_before_birthdate})" }
      - request: { path: /Patient, query: { birthdate: "lt${day_after_birthdate}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate < @${day_after_birthdate})" }
      - request: { path: /Patient, query: { birthdate: "le${day_after_birthdate}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate <= @${day_after_birthdate})" }
      # Parameter combinations.
      - request: { path: /Patient, query: { birthdate: "gt${day_before_birthdate}", family: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate > @${day_before_birthdate} and name.where(family.lower().startsWith('${family}'.lower())).exists())" }
      - request: { path: /Patient, query: { birthdate: "gt${day_before_birthdate}", name: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate > @${day_before_birthdate} and name.where(family.lower().startsWith('${family}'.lower()) or given.where(lower().startsWith('${family}'.lower())).exists()).exists())" }
      - request: { path: /Patient, query: { family: "${family}", gender: "${gender}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(name.where(family.lower().startsWith('${family}'.lower())).exists() and gender = '${gender}')" }
      - request: { path: /Patient, query: { gender: "${gender}", name: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(gender = '${gender}' and name.where(family.lower().startsWith('${family}'.lower()) or given.where(lower().startsWith('${family}'.lower())).exists()).exists())" }
      - request: { path: /Patient, query: { birthdate: "ge${day_before_birthdate}", family: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate >= @${day_before_birthdate} and name.where(family.lower().startsWith('${family}'.lower())).exists())" }
      - request: { path: /Patient, query: { birthdate: "ge${day_before_birthdate}", name: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate >= @${day_before_birthdate} and name.where(family.lower().startsWith('${family}'.lower()) or given.where(lower().startsWith('${family}'.lower())).exists()).exists())" }
      - request: { path: /Patient, query: { birthdate: "lt${day_after_birthdate}", family: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate < @${day_after_birthdate} and name.where(family.lower().startsWith('${family}'.lower())).exists())" }
      - request: { path: /Patient, query: { birthdate: "lt${day_after_birthdate}", name: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate < @${day_after_birthdate} and name.where(family.lower().startsWith('${family}'.lower()) or given.where(lower().startsWith('${family}'.lower())).exists()).exists())" }
      - request: { path: /Patient, query: { birthdate: "le${day_after_birthdate}", family: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate <= @${day_after_birthdate} and name.where(family.lower().startsWith('${family}'.lower())).exists())" }
      - request: { path: /Patient, query: { birthdate: "le${day_after_birthdate}", name: "${family}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate <= @${day_after_birthdate} and name.where(family.lower().startsWith('${family}'.lower()) or given.where(lower().startsWith('${family}'.lower())).exists()).exists())" }
      # Birthdate twice (multiple AND): the kit's fixed bounds, not the patient's.
      - request: { path: /Patient, query: { birthdate: [ge1950-01-01, le2050-01-01] } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate >= @1950-01-01 and birthDate <= @2050-01-01)" }
      - request: { path: /Patient, query: { birthdate: [gt1950-01-01, lt2050-01-01] } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(birthDate.extension.empty()).where(birthDate > @1950-01-01 and birthDate < @2050-01-01)" }
      # Identifier as a value and as system|value.
      - request: { path: /Patient, query: { identifier: "${identifier}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(identifier.where(value = '${identifier}').exists())" }
      - request: { path: /Patient, query: { identifier: "http://ns.electronichealth.net.au/id/hi/ihi/1.0|${ihi}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(identifier.where(system = 'http://ns.electronichealth.net.au/id/hi/ihi/1.0' and value = '${ihi}').exists())" }
      - request: { path: /Patient, query: { identifier: "${mrn_system}|${identifier}" } }
        response: { select: "Bundle.entry.resource.ofType(Patient).where(identifier.where(system = '${mrn_system}' and value = '${identifier}').exists())" }
  validator:
    pairs:
      - { profile: au-core-patient|3.0.0-ballot1, resource: "Patient/${patient_id}", issues: [] }
      # The expected validation failure: a canned error for the second patient.
      - profile: au-core-patient|3.0.0-ballot1
        resource: "Patient/${second_patient_id}"
        issues:
          - { level: ERROR, location: 'Patient.name[0].family', message: Canned error from the Scenario }
    expected_context:
      igs: ['hl7.fhir.au.core#3.0.0-ballot1']
      snomedCT: au
