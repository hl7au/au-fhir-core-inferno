name: Automated Quality Control
# build-and-release.yaml runs after this workflow completes on master, so the
# name and the push trigger on master must stay.
on:
  pull_request:
  push:
    branches: [master]
jobs:
  Spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup environment
        run: make setup
      - name: Run RuboCop
        run: make rubocop
      - name: Run Spec
        run: make tests
