name: Automated Quality Control
on:
  push:
  # Lets the Refresh CI Build Suite workflow run these checks on its pull request.
  workflow_dispatch:
jobs:
  Spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup environment
        run: make setup
      - name: Run RuboCop
        run: make rubocop
      - name: Run Spec
        run: make tests
